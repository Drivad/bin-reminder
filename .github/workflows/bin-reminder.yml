name: Bin Collection Reminder

on:
  schedule:
    # GitHub's scheduler has been firing this 4.5-9h late every day, so the
    # reminder was landing between 18:30 and 23:11. Drift is worst on the hour
    # and at peak times, so fire early at an odd minute: even a 9h delay then
    # lands mid-afternoon rather than near midnight.
    - cron: '37 6 * * *'
  workflow_dispatch:        # allows manual trigger for testing

jobs:
  remind:
    # Runs entirely on GitHub's runners. The council's booking portal rejects
    # datacenter IPs, so collection dates are derived arithmetically, but the
    # council's own website is reachable and supplies bank-holiday changes.
    # Nothing here depends on a machine at home.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bin reminder
        run: python scraper.py
        env:
          POSTCODE: ${{ secrets.POSTCODE }}
          HOUSE_NUMBER: ${{ secrets.HOUSE_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
