name: Bin Collection Reminder

on:
  schedule:
    - cron: '0 14 * * *'  # 2pm UTC daily / 3pm BST (absorbs GitHub scheduler delays)
  workflow_dispatch:        # allows manual trigger for testing

jobs:
  remind:
    # The council portal's load balancer rejects datacenter IPs, so GitHub-hosted
    # runners cannot reach it and the job falls back to the fortnightly maths
    # (which cannot cover garden waste). Switch this to [self-hosted, linux] once
    # a runner is registered on the home network to get full live data.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bin reminder
        run: python scraper.py
        env:
          POSTCODE: ${{ secrets.POSTCODE }}
          HOUSE_NUMBER: ${{ secrets.HOUSE_NUMBER }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
